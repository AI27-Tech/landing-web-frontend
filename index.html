<!doctype html>
<!--
  data-theme fija el tema oscuro de los tokens. La landing es dark-only por diseno
  de marca (ver la cabecera de src/styles/tokens.css), asi que este atributo esta
  aqui como declaracion explicita de esa decision, no como punto de partida para
  un toggle: tokens.css solo define el tema oscuro.
-->
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />

    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <title>AI27 · Inteligencia Predictiva y Seguridad en Tránsito de Carga</title>
    <meta
      name="description"
      content="Más de 25 años asegurando la cadena logística de México. Anticipamos riesgos, predecimos rutas críticas y neutralizamos amenazas antes de que ocurran."
    />

    <!--
      Open Graph: la landing es la primera pantalla que ve un cliente, y casi
      siempre llega compartida en un chat. Sin esto se comparte un preview vacio.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AI27" />
    <meta property="og:locale" content="es_MX" />
    <meta
      property="og:title"
      content="AI27 · Inteligencia Predictiva y Seguridad en Tránsito de Carga"
    />
    <meta
      property="og:description"
      content="Más de 25 años asegurando la cadena logística de México. Anticipamos riesgos, predecimos rutas críticas y neutralizamos amenazas antes de que ocurran."
    />
    <!-- TODO: definir og:image / twitter:image con el recorte real de la marca. -->

    <meta name="twitter:card" content="summary_large_image" />

    <!--
      Google Analytics 4 (gtag.js). La landing es un sitio estático de una sola
      ruta y agnóstico a la plataforma: no usa el SDK de Firebase, así que la
      medición entra con el snippet oficial de GA4, no con firebase/analytics.
      En un sitio de una sola página el propio gtag ya registra el page_view
      inicial; no hay navegación SPA que instrumentar.

      El ID de medición G-XDG9H9EC2H identifica la propiedad GA4 del proyecto
      ai27-landing-page. No es un secreto: solo indica a dónde enviar los datos
      y viaja en el HTML que descarga cualquier visitante; no autoriza nada.
    -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XDG9H9EC2H"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('js', new Date());
      gtag('config', 'G-XDG9H9EC2H');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
